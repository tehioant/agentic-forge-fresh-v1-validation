name: Validation gates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Test actual checkout
        run: python -m unittest discover -v
      - name: Compile actual checkout
        run: python -m compileall -q .
  validation-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned secret scanner
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 60 -o "$RUNNER_TEMP/betterleaks.tar.gz" https://github.com/betterleaks/betterleaks/releases/download/v1.9.0/betterleaks_1.9.0_linux_x64.tar.gz
          printf '%s  %s\n' 'f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7' "$RUNNER_TEMP/betterleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/betterleaks.tar.gz" -C "$RUNNER_TEMP" betterleaks
      - name: Scan retained Git history
        run: '"$RUNNER_TEMP/betterleaks" git --redact --no-banner .'
